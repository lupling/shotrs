<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26293a"/>
      <stop offset="1" stop-color="#15161c"/>
    </linearGradient>
    <linearGradient id="sel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#ff2d2d"/>
    </linearGradient>
  </defs>

  <!-- 底板：圆角方块 -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none"
        stroke="#3a3f52" stroke-width="6"/>

  <!-- 选区框 -->
  <rect x="112" y="140" width="288" height="212" rx="10"
        fill="none" stroke="url(#sel)" stroke-width="18"/>

  <!-- 四角把手 -->
  <g fill="#ffffff" stroke="#ff3b3b" stroke-width="7">
    <rect x="94" y="122" width="40" height="40" rx="9"/>
    <rect x="378" y="122" width="40" height="40" rx="9"/>
    <rect x="94" y="330" width="40" height="40" rx="9"/>
    <rect x="378" y="330" width="40" height="40" rx="9"/>
  </g>

  <!-- 箭头：标注工具的象征 -->
  <g stroke="#ffffff" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M168 316 L330 204"/>
  </g>
  <path d="M352 190 L286 214 L322 250 Z" fill="#ffffff"/>
</svg>
